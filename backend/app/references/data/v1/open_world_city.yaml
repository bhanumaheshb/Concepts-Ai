  - {token: grand theft, category: TITLE, transformed_to: "a city whose content is traversal"}
  - {token: los santos, category: PLACE, justification: "a place name with no transferable content"}
  - {token: neon sign, category: ICONIC_OBJECT, transformed_to: "information that is also the light source"}
  - {token: palm tree boulevard, category: SET_ELEMENT, justification: "a specific streetscape motif, not a principle"}
