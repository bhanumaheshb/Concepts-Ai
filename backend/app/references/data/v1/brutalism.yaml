version: v1
identity:
  reference_id: ref_brutalism
  kind: ARCHITECTURE
  display_name: Brutalist architecture
  aliases: [brutalism, brutalist, beton brut, raw concrete architecture]
  blurb: An architecture of declared mass, visible making and refused ornament.
traits:
  - id: t_bru_mat
    dimension: MATERIAL_BEHAVIOUR
    statement: "the trace of how the thing was made is left deliberately visible on its surface"
    abstraction: 0.90
    salience: 0.95
    maps_to: [tectonic_logic, material_palette]
    suggests: [tectonic_logic:cast_monolithic, material:lime_plaster, material:corten_steel]
    evidence: "Board marks and pour lines are retained rather than finished away."
  - id: t_bru_lang
    dimension: ARCHITECTURAL_LANGUAGE
    statement: "weight is the expression; nothing is applied and nothing is concealed"
    abstraction: 0.88
    salience: 0.92
    maps_to: [architectural_language, tectonic_logic]
    suggests: [architectural_language:brutalist, structural_logic:compression_mass]
    evidence: "Structure, service and surface are the same object."
  - id: t_bru_geom
    dimension: GEOMETRY
    statement: "a small number of large volumes meeting at unmediated angles"
    abstraction: 0.86
    salience: 0.85
    maps_to: [geometry_system, structural_logic]
    suggests: [geometry_system:stepped_orthogonal, geometry_system:fragmented_shard]
    evidence: "Form is composed of few, large, hard-edged masses."
  - id: t_bru_scale
    dimension: SCALE
    statement: "deliberately larger than the body, so a person reads as small against it"
    abstraction: 0.85
    salience: 0.82
    maps_to: [scale_strategy]
    suggests: [scale_strategy:monumental, scale_strategy:heroic]
    evidence: "Human scale is refused as a compositional device."
  - id: t_bru_light
    dimension: LIGHTING_PHILOSOPHY
    statement: "light enters through deep openings and is measured by the shadow the mass casts"
    abstraction: 0.86
    salience: 0.76
    maps_to: [lighting_philosophy]
    suggests: [lighting_philosophy:direct_sun_shafts, lighting_philosophy:darkness_pools]
    evidence: "Deep reveals turn every opening into a light shaft."
  - id: t_bru_env
    dimension: ENVIRONMENTAL_RELATIONSHIP
    statement: "the object sits on the ground as an autonomous fact, indifferent to its surroundings"
    abstraction: 0.84
    salience: 0.74
    maps_to: [site_relationship]
    suggests: [site_relationship:grounded_mass, site_relationship:ignoring_context]
    evidence: "Context is not deferred to; the building asserts its own order."
  - id: t_bru_emotion
    dimension: EMOTIONAL_TONE
    statement: "austere and unsentimental, with severity treated as a form of honesty"
    abstraction: 0.85
    salience: 0.72
    maps_to: [emotional_register]
    suggests: [emotional_register:austere, emotional_register:sublime]
    evidence: "The register is deliberately unwelcoming and deliberately serious."
literal_reading:
  label: raw board-marked concrete mass
  facet_values:
    - architectural_language:brutalist
    - tectonic_logic:cast_monolithic
    - structural_logic:compression_mass
    - scale_strategy:monumental
  surface_tokens: [beton brut, barbican, trellick, concrete monster]
  prevalence: 0.86
  naive_rendering: >
    A heavy board-marked concrete megastructure with deep-set slit windows, cantilevered
    walkways, exposed service towers and a grey overcast sky, photographed in black and
    white from a low angle.
surface_lexicon:
  - {token: brutalism, category: TITLE, transformed_to: "weight declared rather than disguised"}
  - {token: brutalist, category: TITLE, transformed_to: "weight declared rather than disguised"}
  - {token: beton brut, category: FRANCHISE_TERM, transformed_to: "a surface that records its own making"}
  - {token: barbican, category: PLACE, justification: "a place name with no transferable content"}
  - {token: trellick, category: PLACE, justification: "a place name with no transferable content"}
