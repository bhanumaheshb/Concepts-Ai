version: v1
identity:
  reference_id: ref_stepwell
  kind: ARCHITECTURE
  display_name: Indian stepwell
  aliases: [stepwell, step well, baori, vav, subterranean water architecture]
  blurb: Subterranean water architecture in which the ground itself is the material.
traits:
  - id: t_stw_circ
    dimension: CIRCULATION_MOVEMENT
    statement: "descent is the arrival sequence; going down is the ceremony rather than a route to it"
    abstraction: 0.92
    salience: 0.95
    maps_to: [spatial_narrative, occupation_staging]
    suggests: [spatial_narrative:descent, spatial_narrative:revelation, occupation_staging:centred_sunken]
    evidence: "The entire plan is a stair; there is no other way to reach the water."
  - id: t_stw_geom
    dimension: GEOMETRY
    statement: "the whole is generated by repeating one step at several scales"
    abstraction: 0.88
    salience: 0.88
    maps_to: [geometry_system, structural_logic]
    suggests: [geometry_system:stepped_revolve, geometry_system:stepped_orthogonal, structural_logic:corbelled]
    evidence: "A single tread-and-riser module produces the tiers, the galleries and the silhouette."
  - id: t_stw_env
    dimension: ENVIRONMENTAL_RELATIONSHIP
    statement: "thermal mass replaces mechanical cooling; the deeper you go the cooler it becomes"
    abstraction: 0.90
    salience: 0.90
    maps_to: [site_relationship, material_palette]
    suggests: [site_relationship:embedded, site_relationship:terraced_into, material:sandstone]
    evidence: "Depth is used as a climate strategy, not only as a spatial one."
  - id: t_stw_mat
    dimension: MATERIAL_BEHAVIOUR
    statement: "space is made by removal rather than by addition; the material is the ground itself"
    abstraction: 0.90
    salience: 0.85
    maps_to: [tectonic_logic, material_palette]
    suggests: [tectonic_logic:excavated, tectonic_logic:carved, material:sandstone]
    evidence: "Nothing is erected; the volume is cut."
  - id: t_stw_narr
    dimension: NARRATIVE_STRUCTURE
    statement: "the destination is invisible from the entrance and is revealed only in stages"
    abstraction: 0.92
    salience: 0.82
    maps_to: [spatial_narrative, thesis_archetype]
    suggests: [thesis_archetype:excavation, spatial_narrative:discovery]
    evidence: "Sightlines are deliberately withheld until the final landing."
  - id: t_stw_light
    dimension: LIGHTING_PHILOSOPHY
    statement: "a single opening overhead does all the lighting, and shadow is the built material"
    abstraction: 0.86
    salience: 0.78
    maps_to: [lighting_philosophy]
    suggests: [lighting_philosophy:skylight_well, lighting_philosophy:direct_sun_shafts]
    evidence: "One aperture above; everything below is modelled by its falloff."
  - id: t_stw_scale
    dimension: SCALE
    statement: "monumental in section and intimate in plan at the same moment"
    abstraction: 0.85
    salience: 0.72
    maps_to: [scale_strategy]
    suggests: [scale_strategy:monumental, scale_strategy:heroic]
    evidence: "The depth is vast while each landing is small enough for a few people."
literal_reading:
  label: carved subterranean stone stair court
  facet_values:
    - geometry_system:stepped_revolve
    - tectonic_logic:excavated
    - material:sandstone
    - site_relationship:embedded
    - lighting_philosophy:skylight_well
  surface_tokens: [stepwell, baori, vav, jaali, abhaneri, chand]
  prevalence: 0.88
  naive_rendering: >
    A replica Rajasthani stepwell with symmetrical criss-cross sandstone stairs on all
    four sides, carved jaali screens, ornate pavilions at the corners, a green pool at
    the bottom and tourists photographing from the rim.
surface_lexicon:
  - {token: stepwell, category: TITLE, transformed_to: "arrival by descent into the ground"}
  - {token: baori, category: FRANCHISE_TERM, transformed_to: "a cut volume that cools as it deepens"}
  - {token: vav, category: FRANCHISE_TERM, transformed_to: "a cut volume that cools as it deepens"}
  - {token: jaali, category: ICONIC_OBJECT, transformed_to: "a perforated plane that filters light and view"}
  - {token: abhaneri, category: PLACE, justification: "a place name with no transferable spatial content"}
  - {token: chand, category: PLACE, justification: "a place name with no transferable spatial content"}
