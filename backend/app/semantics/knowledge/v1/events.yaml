    elements:
      required: [reveal_platform, presentation_stage, registration_desk]
      recommended: [demo_stations, media_riser, networking_lounge]
      optional: [bar, led_wall]
    visual_priorities: [the product, the moment of reveal, precision, brand clarity]
    must_communicate: ["the product as the hero object", "an audience at the moment of reveal"]
