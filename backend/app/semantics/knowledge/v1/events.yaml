    activities:
      primary: [performance, celebration]
      secondary: [food_stalls, drinks, play]
    audience: distributed
    focal: "several stages and attractions distributed across a site"
    atmosphere: [expansive, festive, communal]
    elements:
      required: [performance_stage, food_stalls]
      recommended: [wayfinding, rest_areas]
      optional: [bar, play_zone]
    visual_priorities: [site scale, multiple attractions, crowds moving]
    must_communicate: ["a site with several attractions at once", "crowds moving between them"]
    relationships: ["stage|stalls", "destination|wandering"]

  award_ceremony:
    label: Awards ceremony
    family: corporate
    aliases: [awards ceremony, award ceremony, awards night, awards gala, award show, awards show]
