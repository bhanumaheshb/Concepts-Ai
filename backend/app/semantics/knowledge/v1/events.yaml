version: v1
# FAMILIES give context. EVENT TYPES decide the design.
#
# event_family and event_type are never interchangeable: a Sangeet and a Haldi are
# both in the wedding_celebration family and have almost nothing in common as
# programmes. The family contributes cultural context and hospitality expectations;
# it never contributes a zone or an element.
#
# An event type here is DOMAIN KNOWLEDGE, not a requirement for support. A brief
# naming an event absent from this file is resolved from its activities instead.
#
# event type fields
#   aliases              phrases that name the event (word-bounded, longest wins)
#   typology             the legacy space-form prior used by ontology affinities
#   activities           primary / secondary — expand to zones via activities.yaml
#   suppress_activities  cues that, inside this event, do not mean what they usually mean
#                        ("a Haldi ceremony" has no ceremony focus)
#   elements             required / recommended / optional element keys (elements.yaml)
#   invariants           hard requirements of this event type
#   traditions           per-tradition additions, selected only when a tradition is known

families:
  wedding_celebration:
    label: Wedding celebration
    domain: event
    cultural_context: ["one of several events in a multi-day family celebration",
                       "hosted by families for extended family and friends"]
    participants: [hosts, the couple, families, guests]
  live_entertainment:
    label: Live entertainment
    domain: event
    participants: [performers, audience, crew]
  corporate:
    label: Corporate event
    domain: event
    participants: [hosts, attendees, presenters, press]
  exhibition:
    label: Exhibition
    domain: event
    participants: [visitors, exhibitors, staff]
  fashion:
    label: Fashion event
    domain: event
    participants: [models, designers, audience, press, crew]
  social_celebration:
    label: Social celebration
    domain: event
    participants: [hosts, guests]
  hospitality:
    label: Hospitality
    domain: interior
    participants: [guests, staff]
  retail:
    label: Retail
    domain: interior
    participants: [shoppers, staff]
  workplace:
    label: Workplace
    domain: interior
    participants: [staff, visitors]
  architecture:
    label: Architecture
    domain: architecture
    participants: [visitors, occupants]
  installation:
    label: Installation
    domain: installation
    participants: [visitors]
  cultural_programme:
    label: Cultural programme
    domain: event
    participants: [audience, performers, hosts]

event_types:

  # ── wedding celebration ──────────────────────────────────────────────────
  sangeet:
    label: Sangeet
    family: wedding_celebration
    aliases: [sangeet, sangeeth, sangeet night, sangeeth night, sangeet ceremony, sangeeth ceremony,
              sangeet function, sangeet party]
    typology: EVENT_STAGE
    activities:
      primary: [performance, dance, celebration]
      secondary: [socialising]
    suppress_activities: [ceremony]
    audience: participatory
    focal: "family performances staged toward a dance floor the guests then take over"
    atmosphere: [energetic, celebratory, musical, festive]
    elements:
      required: [performance_stage, dance_floor]
      recommended: [stage_lighting, sound_system, guest_lounge]
      optional: [bar, dj_booth, live_band, photo_zone]
    visual_priorities: [energy, performance visibility, lighting, movement, people]
    must_communicate: ["performers on a lit stage", "guests dancing", "families gathered around the performance"]
    relationships: ["performance|dance_floor", "family_performers|guests"]

  haldi:
    label: Haldi
    family: wedding_celebration
    aliases: [haldi, haldi ceremony, haldi function, pithi, pithi ceremony, turmeric ceremony, ubtan ceremony]
    typology: GENERIC_SPATIAL
    activities:
      primary: [turmeric_application, celebration]
      secondary: [photography]
    suppress_activities: [ceremony]
    audience: participatory
    focal: "the couple seated low while family members take turns applying turmeric paste"
    atmosphere: [joyful, informal, bright, intimate, daylit]
    elements:
      required: [haldi_seat, wash_station]
      recommended: [washable_surfaces, family_seating, photo_zone]
      optional: [food_counter, music_corner]
    visual_priorities: [daylight, turmeric-yellow tones, intimacy, family interaction, candid photography]
    must_communicate: ["family members applying turmeric paste to the seated couple", "yellow as the dominant colour", "open daylight"]
    relationships: ["couple|family", "messy|protected"]
    operational: [water and towels close to the seat, protected floor]

  mehendi:
    label: Mehendi
    family: wedding_celebration
    aliases: [mehendi, mehndi, mehendi ceremony, mehndi ceremony, mehendi function, henna night, henna party]
    typology: GENERIC_SPATIAL
    activities:
      primary: [henna_application, celebration]
      secondary: [socialising, music]
    suppress_activities: [ceremony]
    audience: convivial
    focal: "guests seated with henna artists while the family lounges, sings and talks"
    atmosphere: [relaxed, colourful, intimate, musical]
    elements:
      required: [henna_stations, family_seating]
      recommended: [guest_lounge, photo_zone]
      optional: [food_counter, music_corner]
    visual_priorities: [intimacy, colour, hands and detail, lounging groups]
    must_communicate: ["henna artists at work on guests' hands", "low relaxed seating", "an afternoon gathering"]
    relationships: ["artist|guest", "waiting|drying"]

  wedding_reception:
    label: Wedding reception
    family: wedding_celebration
    aliases: [wedding reception, reception party, reception dinner, marriage reception, post-wedding reception]
    typology: EVENT_STAGE
    activities:
      primary: [celebration, dining]
      secondary: [socialising, photography]
    suppress_activities: [ceremony]
    audience: convivial
    focal: "the couple received on a stage while guests dine and queue to greet them"
    atmosphere: [elegant, celebratory, warm]
    elements:
      required: [couple_stage, dining_tables]
      recommended: [guest_lounge, photo_zone, stage_lighting]
      optional: [bar, dance_floor]
    visual_priorities: [the couple's stage, dining guests, warmth, hospitality]
    must_communicate: ["guests queuing to greet the couple on stage", "dining in progress"]
    relationships: ["couple_stage|guests", "greeting_queue|dining"]

  engagement:
    label: Engagement
    family: wedding_celebration
    aliases: [engagement, engagement ceremony, engagement party, ring ceremony, roka, sagai, misri]
    typology: EVENT_STAGE
    activities:
      primary: [celebration]
      secondary: [dining, socialising, photography]
    suppress_activities: [ceremony]
    audience: frontal
    focal: "the ring exchange on a low stage the families gather around"
    atmosphere: [intimate, celebratory, elegant]
    elements:
      required: [ring_exchange_stage]
      recommended: [family_seating, photo_zone]
      optional: [bar, dance_floor, dining_tables]
    visual_priorities: [the exchange moment, families, intimacy]
    must_communicate: ["the couple exchanging rings", "families gathered close"]
    relationships: ["couple|families"]

  cocktail_night:
    label: Cocktail night
    family: wedding_celebration
    aliases: [cocktail night, cocktail party, cocktail evening, cocktails night]
    typology: EVENT_STAGE
    activities:
      primary: [drinks, socialising]
      secondary: [music, dance]
    audience: convivial
    focal: "a bar and lounge landscape with a music focus for later in the night"
    atmosphere: [glamorous, social, nocturnal]
    elements:
      required: [bar, guest_lounge]
      recommended: [dj_booth, dance_floor]
      optional: [photo_zone]
    visual_priorities: [bar glow, lounge groups, night lighting]
    must_communicate: ["guests with drinks in lounge clusters", "a glowing bar"]
    relationships: ["bar|lounge", "lounge|dance_floor"]

  wedding_ceremony:
    label: Wedding ceremony
    family: wedding_celebration
    aliases: [wedding ceremony, marriage ceremony, wedding mandap, mandap, mandapam, vivah, pheras,
              nikah, nikah ceremony, anand karaj, church wedding, wedding vows]
    # Words that name the FAMILY rather than an event in it. They resolve to this type only
    # when nothing more specific matched — "a Sangeet for my sister's wedding" is a Sangeet.
    family_aliases: [wedding, weddings, shaadi, marriage, wedding celebration]
    typology: WEDDING_MANDAP
    activities:
      primary: [ceremony]
      secondary: [celebration]
    audience: frontal
    focal: "the ceremony focus every guest can see"
    atmosphere: [ceremonial, significant, joyful]
    elements:
      required: [ceremony_focus, guest_seating]
      recommended: [processional_route]
      optional: [bar, guest_lounge]
    visual_priorities: [the ceremony focus, witnesses, significance]
    must_communicate: ["the ceremony focus", "guests witnessing"]
    relationships: ["ceremony|witnesses", "arrival|ceremony"]
    ritual_refs: [ritual:seating_sightline]
    traditions:
      hindu:
        label: Hindu wedding
        focal: "the mandap sheltering the sacred fire, open to the sky"
        elements:
          required: [mandap, ritual_fire]
          recommended: [varmala_platform, pheras_circuit, priest_platform]
        ritual_refs: [ritual:agni_kund, ritual:seating_sightline]
        must_communicate: ["the mandap with the ritual fire at its centre"]
        invariants:
          - {id: c_ritual_agni, sacred: true, category: RITUAL,
             statement: "A fire vessel must be present at the ceremonial centre, open to the sky, with 1.5 m radial and 4 m overhead clearance."}
          - {id: c_ritual_canopy, category: RITUAL,
             statement: "The ceremonial centre is marked by a distinct canopy or covering condition. Four posts are the common resolution, not the only one."}
      muslim:
        label: Nikah
        focal: "the nikah stage where the couple and the officiant are seated"
        elements:
          required: [nikah_stage]
          recommended: [screened_approach]
        ritual_refs: [ritual:seating_sightline]
        must_communicate: ["the seated nikah platform", "a controlled, screened approach"]
        invariants:
          - {id: c_ritual_nikah_seating, sacred: true, category: RITUAL,
             statement: "The couple and the officiant are seated at the ceremonial centre; no fire element is present."}
          - {id: c_ritual_nikah_approach, category: RITUAL,
             statement: "The ceremonial platform has a controlled approach and a defined degree of screening from the general seating."}
      christian:
        label: Christian wedding
        focal: "the altar terminating a single processional aisle"
        elements:
          required: [altar, church_aisle]
          recommended: [priest_platform]
        ritual_refs: [ritual:seating_sightline]
        must_communicate: ["the aisle leading to the altar"]
        invariants:
          - {id: c_ritual_altar, sacred: true, category: RITUAL,
             statement: "The ceremony terminates on an altar or equivalent standing focus; no fire element is present."}
          - {id: c_ritual_aisle, category: RITUAL,
             statement: "A single processional axis runs from the entrance to the altar, wide enough to walk two abreast."}
      sikh:
        label: Anand Karaj
        focal: "the Palki Sahib on its raised canopied dais"
        elements:
          required: [palki_sahib]
          recommended: [floor_seating]
        ritual_refs: [ritual:seating_sightline]
        must_communicate: ["the canopied dais", "guests seated on the floor facing it"]
        invariants:
          - {id: c_ritual_palki, sacred: true, category: RITUAL,
             statement: "The Guru Granth Sahib rests on a raised, canopied dais; nothing is placed above it and no fire element is present."}
          - {id: c_ritual_floor_seating, category: RITUAL,
             statement: "Guests are seated at floor level facing the dais, with a clear circumambulation route around it."}
      secular:
        label: Secular wedding
        focal: "one unambiguous ceremony focus"
        elements:
          required: [ceremony_focus]
        ritual_refs: [ritual:seating_sightline]
        invariants:
          - {id: c_ritual_focus, category: RITUAL,
             statement: "The ceremony has one unambiguous spatial focus that every guest can see."}

  # ── live entertainment ───────────────────────────────────────────────────
  music_concert:
    label: Music concert
    family: live_entertainment
    aliases: [concert, concerts, music concert, live concert, gig, music festival stage, live music night]
    typology: EVENT_STAGE
    activities:
      primary: [performance]
      secondary: [drinks, media]
    audience: frontal
    focal: "a performance stage facing a standing audience field"
    atmosphere: [loud, collective, charged, nocturnal]
    elements:
      required: [performance_stage, audience_field, sound_system, stage_lighting]
      recommended: [front_of_house_mix, crowd_barrier, backstage]
      optional: [bar, led_wall]
    zones:
      - {key: audience_field, label: Standing audience field, role: audience, priority: required, area_share: 0.40, capacity_share: 0.90}
      - {key: front_of_house, label: Front-of-house mix position, role: technical, priority: required, area_share: 0.02}
      - {key: security_egress, label: Security and egress routes, role: circulation, priority: required, area_share: 0.06}
    visual_priorities: [stage lighting, crowd scale, energy, sightlines]
    must_communicate: ["a lit stage with performers", "a dense crowd facing it", "beams of stage light"]
    relationships: ["stage|crowd", "front_of_house|stage"]
    operational: [load-in dock, crowd management, emergency egress]

  festival:
    label: Festival
    family: live_entertainment
    aliases: [festival, music festival, arts festival, food festival, cultural festival, fest]
