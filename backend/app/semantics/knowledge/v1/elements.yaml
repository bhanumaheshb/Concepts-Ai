version: v1
# ELEMENTS — the things a concept can contain, and where each one belongs.
#
#   aliases   phrases that name the element in a brief or in generated text
#   zone      the programme zone the element materialises as, when required/recommended.
#             A zone key shared with an activity zone MERGES with it; `label` then names
#             it more specifically ("ceremony_focus" becomes "Mandap").
#   scope     where the element natively belongs. OMITTED = neutral, usable anywhere.
#               event_types  the element belongs only to these event types
#               families     ...or only to events in these families
#               traditions   ...and, when present, only to these traditions
#   physical  false for words that name a context rather than a thing ("wedding", "bride")
#
# NEGATIVE SEMANTICS ARE DERIVED, NOT LISTED. A scoped element is FORBIDDEN for every
# brief outside its scope, unless the user explicitly asks for it. Nobody writes
# "a concert must not contain a mandap"; it follows from where a mandap belongs.
# Adding a new ritual element to this file protects every existing event type from it.
