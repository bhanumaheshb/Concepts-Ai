  runway:
    label: Runway show
    cues: [runway, catwalk, fashion show, fashion week, model walk, collection show]
    audience: surround
    zones:
      - {key: runway, label: Runway, role: performance, priority: required, area_share: 0.08}
      - {key: runway_seating, label: Front-row and tiered seating, role: audience, priority: required, area_share: 0.25, capacity_share: 0.75}
      - {key: backstage, label: Backstage, role: backstage, priority: required, area_share: 0.08}
      - {key: press_pit, label: Press and photographers' pit, role: media, priority: recommended, area_share: 0.03}
      - {key: technical_control, label: Show control, role: technical, priority: recommended, area_share: 0.02}
    relationships: ["model|audience", "backstage|runway", "runway|press_pit"]
    human_activity: "a model mid-stride on the runway, rows of guests and photographers watching"
    time_of_day: evening
    invariants:
      - {id: c_runway_sightline, statement: "The full runway length must be visible from every seat and from the press pit at its end."}
