    cues: [celebration, celebrate, celebrating, party, festivities, festive]
    audience: convivial
    zones:
      - {key: guest_gathering, label: Guest gathering, role: social, priority: required, area_share: 0.18, capacity_share: 0.45}
    relationships: ["hosts|guests", "gathering|focus"]
    human_activity: "guests gathered in animated groups, talking and laughing"
    time_of_day: evening

  socialising:
    label: Socialising
