version: v1
# ACTIVITIES are the unit of programme inference.
#
# An event type the knowledge base has never seen is still programmable, because
# what HAPPENS in it can be recognised: "projection surfaces, live narration and
# informal seating" implies a projection field, a narrator's position and a
# lounging audience without anyone having written an entry for that event.
#
#   cues            phrases that indicate the activity in a brief (word-bounded)
#   zones           spaces the activity needs; area/capacity shares are of the site / crowd
#   audience        how attention is organised when this activity leads
#   relationships   conceptual pairs a creative operator may act on ("a|b")
#   human_activity  what people are visibly doing — used by the Visual Director
#   time_of_day     the default light this activity is experienced in
#   invariants      hard requirements this activity imposes, whatever the event
#   operational     back-of-house needs
activities:

  performance:
    label: Live performance
    cues: [perform, performs, performance, performances, performer, performers, live band,
           band, concert, recital, gig, live music, orchestra, singer, singers, musicians]
    audience: frontal
    zones:
      - {key: performance_stage, label: Performance stage, role: performance, priority: required, area_share: 0.10}
      - {key: backstage, label: Backstage and green room, role: backstage, priority: recommended, area_share: 0.04}
      - {key: technical_control, label: Sound and lighting control, role: technical, priority: recommended, area_share: 0.02}
    relationships: ["performer|audience", "stage|house"]
    human_activity: "performers mid-performance, the audience turned toward the stage"
    time_of_day: evening
    invariants:
      - {id: c_sightline_performance, statement: "Every audience position must have an unobstructed sightline to the performance stage."}
    operational: [performer changing and holding, stage power and rigging, sound and lighting control position]

  dance:
    label: Dancing
    cues: [dance, dancing, dance floor, choreography, choreographed, garba, dandiya, bhangra]
    audience: participatory
    zones:
      - {key: dance_floor, label: Dance floor, role: participation, priority: required, area_share: 0.14, capacity_share: 0.35}
    relationships: ["dance_floor|spectators", "dancers|performers"]
    human_activity: "guests dancing, bodies in motion, others gathered at the edge of the floor"
    time_of_day: night

  music:
