version: v1
# PHYSICAL defaults per space form, filled in when the brief omits them and marked
# source=DEFAULT so they are surfaced rather than silently assumed.
#
# A typology is a SPACE FORM — how big, indoor or out, how long to build. It carries
# no zones, invariants or rites. Those describe what HAPPENS in the space, and they
# live in the semantic knowledge base (app/semantics/knowledge), selected by the
# event the brief describes. Keeping them here is what used to make every event
# resolved to WEDDING_MANDAP a mandap ceremony.
typologies:
  WEDDING_MANDAP:
    capacity: {guests: 200, seated: 200, principals: 2}
    site: {kind: OUTDOOR, width_m: 34, depth_m: 24, ground: LAWN}
    schedule: {load_in_hours: 24, strike_hours: 8}
