version: v1
# Default invariants filled in when the brief omits them. Marked source=DEFAULT and
# surfaced to the user for confirmation rather than silently assumed.
typologies:
  WEDDING_MANDAP:
    capacity: {guests: 200, seated: 200, principals: 2}
    site: {kind: OUTDOOR, width_m: 34, depth_m: 24, ground: LAWN}
    schedule: {load_in_hours: 24, strike_hours: 8}
    required_zones:
      - {zone: ceremony, min_area_m2: 60, capacity: 0}
      - {zone: seating, min_area_m2: 180, capacity: 200}
      - {zone: arrival, min_area_m2: 30, capacity: 0}
    # Tradition-neutral. Only what is true of ANY wedding lives here; everything
    # ceremony-specific is under `traditions` and selected by brief.tradition.
    ritual:
      tradition: unspecified
      required_elements: [ritual:seating_sightline]
    invariants:
      - {id: c_sightline_all, category: PROGRAM,
         statement: "Every seated guest must have an unobstructed sightline to the ceremonial centre."}
    # ── per-tradition ceremony ───────────────────────────────────────────────
    # `sacred: true` means UNREACHABLE BY EVERY MUTATION OPERATOR, FOREVER. It is
    # therefore reserved for what the rite genuinely requires. A convention — however
    # common — is expressed as a normal invariant so the radical and wildcard roles
    # can still argue with it. Locking convention at sacred level is what made every
    # wedding resolve to a four-column pavilion regardless of its architecture.
    traditions:
      HINDU:
        ritual:
          tradition: hindu_north_indian
          required_elements: [ritual:agni_kund, ritual:seating_sightline]
        invariants:
          - {id: c_ritual_agni, category: RITUAL, sacred: true,
             statement: "A fire vessel must be present at the ceremonial centre, open to the sky, with 1.5 m radial and 4 m overhead clearance."}
          - {id: c_ritual_canopy, category: RITUAL,
             statement: "The ceremonial centre is marked by a distinct canopy or covering condition. Four posts are the common resolution, not the only one."}
      MUSLIM:
        ritual:
          tradition: muslim_nikah
          required_elements: [ritual:seating_sightline]
        invariants:
          - {id: c_ritual_nikah_seating, category: RITUAL, sacred: true,
             statement: "The couple and the officiant are seated at the ceremonial centre; no fire element is present."}
          - {id: c_ritual_nikah_approach, category: RITUAL,
             statement: "The ceremonial platform has a controlled approach and a defined degree of screening from the general seating."}
      CHRISTIAN:
        ritual:
          tradition: christian_ceremony
          required_elements: [ritual:seating_sightline]
        invariants:
          - {id: c_ritual_altar, category: RITUAL, sacred: true,
             statement: "The ceremony terminates on an altar or equivalent standing focus; no fire element is present."}
          - {id: c_ritual_aisle, category: RITUAL,
             statement: "A single processional axis runs from the entrance to the altar, wide enough to walk two abreast."}
      SIKH:
        ritual:
          tradition: sikh_anand_karaj
          required_elements: [ritual:seating_sightline]
        invariants:
          - {id: c_ritual_palki, category: RITUAL, sacred: true,
             statement: "The Guru Granth Sahib rests on a raised, canopied dais; nothing is placed above it and no fire element is present."}
          - {id: c_ritual_floor_seating, category: RITUAL,
             statement: "Guests are seated at floor level facing the dais, with a clear circumambulation route around it."}
      SECULAR:
        ritual:
          tradition: secular_ceremony
          required_elements: [ritual:seating_sightline]
        invariants:
          - {id: c_ritual_focus, category: RITUAL,
             statement: "The ceremony has one unambiguous spatial focus that every guest can see."}
  EVENT_STAGE:
    capacity: {guests: 500, seated: 400, principals: 6}
    site: {kind: COVERED, width_m: 40, depth_m: 28, ground: HARD}
    schedule: {load_in_hours: 16, strike_hours: 6}
    required_zones:
      - {zone: stage, min_area_m2: 80, capacity: 0}
      - {zone: audience, min_area_m2: 300, capacity: 500}
    invariants:
      - {id: c_sightline_all, category: PROGRAM,
         statement: "Every audience position must have an unobstructed sightline to the stage."}
  RESTAURANT:
    capacity: {guests: 60, seated: 60, principals: 0}
    site: {kind: INDOOR, width_m: 18, depth_m: 12, ground: FLOOR}
    schedule: {load_in_hours: 400, strike_hours: 0}
    required_zones:
      - {zone: dining, min_area_m2: 90, capacity: 60}
      - {zone: bar, min_area_m2: 18, capacity: 8}
      - {zone: entry, min_area_m2: 10, capacity: 0}
    invariants:
      - {id: c_covers, category: CAPACITY,
         statement: "The dining zone must seat the stated number of covers."}
  INTERIOR:
    capacity: {guests: 30, seated: 20, principals: 0}
    site: {kind: INDOOR, width_m: 14, depth_m: 10, ground: FLOOR}
    schedule: {load_in_hours: 300, strike_hours: 0}
    required_zones:
      - {zone: main, min_area_m2: 70, capacity: 30}
  PAVILION:
    capacity: {guests: 150, seated: 60, principals: 0}
    site: {kind: OUTDOOR, width_m: 30, depth_m: 30, ground: LAWN}
    schedule: {load_in_hours: 72, strike_hours: 24}
    required_zones:
      - {zone: shelter, min_area_m2: 90, capacity: 150}
      - {zone: approach, min_area_m2: 40, capacity: 0}
  EXHIBITION:
    capacity: {guests: 120, seated: 0, principals: 0}
    site: {kind: INDOOR, width_m: 24, depth_m: 16, ground: FLOOR}
    schedule: {load_in_hours: 48, strike_hours: 12}
    required_zones:
      - {zone: gallery, min_area_m2: 160, capacity: 120}
      - {zone: entry, min_area_m2: 20, capacity: 0}
  GENERIC_SPATIAL:
    capacity: {guests: 100, seated: 60, principals: 0}
    site: {kind: OUTDOOR, width_m: 28, depth_m: 20, ground: LAWN}
    schedule: {load_in_hours: 48, strike_hours: 12}
    required_zones:
      - {zone: main, min_area_m2: 100, capacity: 100}
