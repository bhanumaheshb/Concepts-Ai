version: v1
# Curated mode seeds per typology. This is the anti-brief's production fallback,
# not a test fixture — it is why stage 03 cannot fail (spec R-ANTI-01).
typologies:
  WEDDING_MANDAP: &wedding_celebration_cliches
    # Drawn from the actual market, not from imagination. Six unrelated real mandaps
    # differ in surface — gold vs white, roses vs marigolds, Dravidian vs Mughal — and
    # are nonetheless ONE ROOM. What repeats is the CONFIGURATION, so that is what is
    # named here. Banning the materials would only strip a wedding of its vocabulary;
    # banning the configuration is what makes a different answer possible.
    - label: "gilded object on a backdrop wall"
      prevalence: 0.92
      # The dominant cliche: the mandap is an OBJECT you look AT, frontally and
      # symmetrically, against a decorated wall — never a space you stand inside.
      facet_values: [occupation_staging:centred_raised, occupation_staging:frontal_stage,
                     geometry_system:charbagh_orthogonal, structural_logic:post_and_beam,
                     tectonic_logic:stacked, site_relationship:grounded_mass,
                     lighting_philosophy:grazing_wash, scale_strategy:heroic]
      surface_tokens: [backdrop wall, symmetrical backdrop, throne chairs, two thrones,
                       gilded, gold leaf, carved columns, ornate carving, elephant statues,
                       peacock motif, temple pastiche, gopuram]
    - label: "ornament applied to every surface"
      prevalence: 0.88
      # Decoration as the design move: whatever the structure is, carve it and gild it.
      # The tell is that ornament is uniform — it describes no hierarchy and answers
      # no condition.
      facet_values: [architectural_language:mughal_courtyard,
                     architectural_language:dravidian_temple,
                     tectonic_logic:stacked, material:marble]
      surface_tokens: [uniform ornament, all-over carving, applied filigree,
                       gold on every surface, encrusted, jewelled surface]
    - label: "flat frontal uplight"
      prevalence: 0.80
      # Everything lit evenly from below so nothing has shadow, depth or a focus.
      # Light stops being a design decision and becomes a coating.
      facet_values: [lighting_philosophy:grazing_wash, occupation_staging:centred_raised]
      surface_tokens: [flat frontal lighting, even uplighting, no shadow,
                       shadowless, evenly lit throughout]
    - label: "draped fabric ceiling"
      prevalence: 0.78
      facet_values: [tectonic_logic:draped, material:silk_drape,
                     structural_logic:post_and_beam, occupation_staging:centred_raised]
      surface_tokens: [ceiling drape, swags, tenting, tulle, fairy lights,
                       pleated ceiling, fabric canopy]
    - label: "floral wall spectacle"
      prevalence: 0.75
      # Flowers used as CLADDING for a flat plane, rather than as mass, scent, decay
      # or a structural idea.
      facet_values: [material:cut_flower, material:fresh_flower_wall,
                     geometry_system:radial_concentric, scale_strategy:heroic]
      surface_tokens: [flower wall, floral arch, rose wall, hanging garland curtain,
                       flower cladding, red and gold roses]
  EVENT_STAGE:
    - label: "LED wall and truss"
      prevalence: 0.82
      facet_values: [lighting_philosophy:projected_light, structural_logic:space_frame,
                     occupation_staging:frontal_stage, material:anodised_aluminium,
                     tectonic_logic:assembled_modular, site_relationship:grounded_mass]
      surface_tokens: [led wall, truss, moving heads, haze, screen]
    - label: "mirrored glamour box"
      prevalence: 0.66
      facet_values: [material:mirror_polymer, geometry_system:orthogonal_grid, emotional_register:euphoric]
      surface_tokens: [mirror ball, sequins, gloss black, strobe]
  RESTAURANT:
    - label: "industrial edison warehouse"
      prevalence: 0.80
      facet_values: [material:brick, material:corten_steel, lighting_philosophy:grazing_wash,
                     architectural_language:brutalist, structural_logic:post_and_beam,
                     tectonic_logic:stacked, occupation_staging:dispersed_clusters]
      surface_tokens: [edison bulb, exposed brick, ductwork, subway tile, blackboard]
    - label: "soft luxe banquette"
      prevalence: 0.70
      facet_values: [material:brass, material:marble, emotional_register:intimate,
                     occupation_staging:dispersed_clusters]
      surface_tokens: [velvet banquette, brass trim, marble bar, pendant lights]
  INTERIOR:
    - label: "warm minimal beige"
      prevalence: 0.83
      facet_values: [architectural_language:miesian_minimal, material:lime_plaster,
                     emotional_register:contemplative, lighting_philosophy:reflected_daylight,
                     structural_logic:post_and_beam, tectonic_logic:cast_monolithic]
      surface_tokens: [beige, boucle, travertine, minimal, arch niche, curved wall]
  PAVILION:
    - label: "white tensile canopy"
      prevalence: 0.76
      facet_values: [architectural_language:tensile_membrane, material:ptfe_membrane,
                     structural_logic:membrane_tension, site_relationship:grounded_mass,
                     tectonic_logic:tensioned, occupation_staging:dispersed_clusters]
      surface_tokens: [white canopy, tent, guy ropes, sail]
    - label: "timber slat box"
      prevalence: 0.68
      facet_values: [material:teak, geometry_system:modular_bay, tectonic_logic:assembled_modular]
      surface_tokens: [timber slats, batten screen, plywood box]
  EXHIBITION:
    - label: "white cube plinth"
      prevalence: 0.81
      facet_values: [architectural_language:miesian_minimal, geometry_system:orthogonal_grid,
                     lighting_philosophy:grazing_wash, occupation_staging:dispersed_clusters,
                     structural_logic:post_and_beam, tectonic_logic:assembled_modular]
      surface_tokens: [white cube, plinth, track lighting, vinyl lettering]
    - label: "immersive projection room"
      prevalence: 0.74
      facet_values: [lighting_philosophy:projected_light, spatial_narrative:immersion,
                     material:mirror_polymer]
      surface_tokens: [projection mapping, infinity mirror, immersive room]
  GENERIC_SPATIAL:
    - label: "neutral contemporary"
      prevalence: 0.70
      facet_values: [architectural_language:miesian_minimal, geometry_system:orthogonal_grid,
                     material:lime_plaster]
      surface_tokens: [minimal, neutral palette, clean lines]

# The configurations above are what the WEDDING CELEBRATION market repeats — at a
# Sangeet, a Haldi and a reception as much as at a ceremony. They are the family's
# cliches, so every event in the family pushes against them, not only the mandap.
families:
  wedding_celebration: *wedding_celebration_cliches

  # Live entertainment repeats the rental catalogue: black truss, LED wall, haze.
  live_entertainment:
    - label: "black truss rig and LED wall"
      prevalence: 0.85
      facet_values: [structural_logic:space_frame, lighting_philosophy:projected_light,
                     occupation_staging:frontal_stage, material:anodised_aluminium,
                     tectonic_logic:truss_dressed, emotional_register:euphoric]
      surface_tokens: [led wall, black truss, moving heads, haze, co2 jets, confetti cannon]
    - label: "festival field of pop-up tents"
      prevalence: 0.70
      facet_values: [architectural_language:tensile_membrane, material:canvas_membrane,
                     occupation_staging:dispersed_clusters, tectonic_logic:tensioned]
      surface_tokens: [gazebo tents, bunting, festoon lights, hay bales]
  corporate:
    - label: "black box, stage and screen"
      prevalence: 0.84
      facet_values: [occupation_staging:frontal_stage, lighting_philosophy:projected_light,
                     geometry_system:orthogonal_grid, architectural_language:miesian_minimal,
                     tectonic_logic:assembled_modular, emotional_register:austere]
      surface_tokens: [black box, lectern, branded backdrop, step-and-repeat, led screen]
  fashion:
    - label: "white runway between straight rows"
      prevalence: 0.86
      facet_values: [occupation_staging:thrust_runway, geometry_system:orthogonal_grid,
                     architectural_language:miesian_minimal, lighting_philosophy:grazing_wash,
                     emotional_register:austere, tectonic_logic:assembled_modular]
      surface_tokens: [white runway, straight front row, photographers' riser, backdrop logo]
  exhibition:
    - label: "shell-scheme booths on an aisle grid"
      prevalence: 0.82
      facet_values: [geometry_system:modular_bay, occupation_staging:dispersed_clusters,
                     tectonic_logic:assembled_modular, structural_logic:modular_frame,
                     lighting_philosophy:grazing_wash]
      surface_tokens: [shell scheme, booth fascia, carpet tiles, aisle grid, pop-up banner]

# The convention of a specific event, where it differs from its family's.
events:
  product_launch:
    - label: "curtain drop on a turntable under a screen"
      prevalence: 0.84
      facet_values: [occupation_staging:concealed_reveal, occupation_staging:frontal_stage,
                     lighting_philosophy:projected_light, material:polished_steel,
                     emotional_register:theatrical, tectonic_logic:assembled_modular]
      surface_tokens: [kabuki drop, turntable, countdown screen, dry ice reveal, brand logo wall]
  conference:
    - label: "theatre rows facing a lectern and three screens"
      prevalence: 0.86
      facet_values: [occupation_staging:frontal_stage, occupation_staging:layered_terraces,
                     lighting_philosophy:projected_light, geometry_system:orthogonal_grid,
                     emotional_register:austere]
      surface_tokens: [theatre rows, lectern, triple screen, lanyard, pipe and drape]
